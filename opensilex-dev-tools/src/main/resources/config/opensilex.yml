                gridfs:
                    implementation: org.opensilex.fs.gridfs.GridFSConnection
                    config:
                        host: localhost
                        port: 8668
                        database: opensilex
            # customPath:
            #     datafile/: irods

big-data:
    mongodb:
        config:
            host: localhost
            port: 8668
            database: opensilex
