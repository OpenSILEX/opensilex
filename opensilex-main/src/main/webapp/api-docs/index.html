<!DOCTYPE html>
<html class="coverLight">  <!-- coverLight -> add phis wallpaper Arnaud Charleroy -->
    <head>
        <meta charset="UTF-8">
        <title>OpenSILEX API Documentation</title>
        <link rel="icon" type="image/png" href="../webjars/swagger-ui/5.32.8/favicon-32x32.png" sizes="32x32" />
        <link rel="icon" type="image/png" href="../webjars/swagger-ui/5.32.8/favicon-16x16.png" sizes="16x16" />
        <link rel="stylesheet" type="text/css" href="../webjars/swagger-ui/5.32.8/swagger-ui.css" />
        <!--personal css file-->
        <link rel="stylesheet" href="../css/style.css" type="text/css">

        <style>
            #jsonLink {
                text-align: right;
                padding: 15px 25px;
                background-color: #1b1b1b;
            }
            #jsonLink a {
                color: #ffffff;
                font-family: sans-serif;
                font-weight: bold;
                text-decoration: none;
            }
            #jsonLink a:hover {
                text-decoration: underline;
            }
            .btn-reset-fields {
                background-color: #e53935 !important;
                color: #ffffff !important;
                border-color: #e53935 !important;
                border-radius: 4px !important;
                padding: 6px 14px !important;
                font-size: 13px !important;
                font-weight: bold !important;
                cursor: pointer !important;
                margin-left: 10px !important;
                transition: background-color 0.2s ease-in-out;
                font-family: sans-serif !important;
            }
            .btn-reset-fields:hover {
                background-color: #c62828 !important;
                border-color: #c62828 !important;
            }
        </style>
    </head>

    <body class="swagger-section">
        <div id="jsonLink" class="swagger-ui-wrap">
            <a href="../rest/openapi.json">Access to openapi.json</a>
        </div>
        <div id="swagger-ui"></div>

        <script src="../webjars/swagger-ui/5.32.8/swagger-ui-bundle.js" charset="UTF-8"></script>
        <script src="../webjars/swagger-ui/5.32.8/swagger-ui-standalone-preset.js" charset="UTF-8"></script>

        <script type="text/javascript">
            const ResetFieldsPlugin = function(system) {
                return {
                    wrapComponents: {
                        execute: function(Original, system) {
                            return function(props) {
                                return system.React.createElement(
                                    "div",
                                    {
                                        style: {
                                            display: "inline-flex",
                                            alignItems: "center",
                                            gap: "10px"
                                        }
                                    },
                                    system.React.createElement(Original, props),
                                    system.React.createElement(
                                        "button",
                                        {
                                            className: "btn btn-reset-fields",
                                            type: "button",
                                            onClick: function(e) {
                                                var btn = e.currentTarget;
                                                var container = btn.closest(".opblock-body") || btn.closest(".opblock");
                                                if (container) {
                                                    var inputs = container.querySelectorAll("input, textarea, select");
                                                    inputs.forEach(function(el) {
                                                        if (el.tagName === "SELECT") {
                                                            el.selectedIndex = 0;
                                                            el.dispatchEvent(new Event("change", { bubbles: true }));
                                                        } else {
                                                            var proto = el.tagName === "TEXTAREA"
                                                                ? window.HTMLTextAreaElement.prototype
                                                                : window.HTMLInputElement.prototype;
                                                            var setter = Object.getOwnPropertyDescriptor(proto, "value");
                                                            if (setter && setter.set) {
                                                                setter.set.call(el, "");
                                                            } else {
                                                                el.value = "";
                                                            }
                                                            el.dispatchEvent(new Event("input", { bubbles: true }));
                                                            el.dispatchEvent(new Event("change", { bubbles: true }));
                                                        }
                                                    });
                                                }
                                            }
                                        },
                                        "Reset All Fields"
                                    )
                                );
                            };
                        }
                    }
                };
            };

            const HideAuthorizationParamPlugin = function(system) {
                return {
                    wrapComponents: {
                        parameterRow: function(Original, system) {
                            return function(props) {
                                if (props && props.param && (
                                    props.param.get("name") === "Authorization" ||
                                    props.param.get("name") === "authorization"
                                )) {
                                    return null;
                                }
                                return system.React.createElement(Original, props);
                            };
                        }
                    }
                };
            };

            window.onload = function () {
                var url = window.location.search.match(/url=([^&]+)/);
                var pathParts = window.location.pathname.split("/");
                pathParts.pop();
                pathParts.pop();
                pathParts.shift();
                var hostPath = window.location.protocol + "//" + window.location.host + "/";
                pathParts.push("rest");
                var rootPath = hostPath + pathParts.join("/") + "/";
                if (url && url.length > 1) {
                    url = decodeURIComponent(url[1]);
                } else {
                    url = rootPath + "openapi.json";
                }

                const ui = SwaggerUIBundle({
                    url: url,
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl,
                        ResetFieldsPlugin,
                        HideAuthorizationParamPlugin
                    ],
                    layout: "StandaloneLayout",
                    persistAuthorization: true,
                    tagsSorter: function (a, b) {
                        if (a === "Authentication") return -1;
                        if (b === "Authentication") return 1;
                        if (a === "Security") return -1;
                        if (b === "Security") return 1;
                        return a.localeCompare(b);
                    },
                    operationsSorter: function (a, b) {
                        var pathA = a.get("path") || "";
                        var pathB = b.get("path") || "";
                        if (pathA.indexOf("/security/authenticate") !== -1) return -1;
                        if (pathB.indexOf("/security/authenticate") !== -1) return 1;
                        return pathA.localeCompare(pathB);
                    },
                    responseInterceptor: function (response) {
                        if (response && response.url && response.body && (
                            response.url.indexOf("/brapi/v1/token") !== -1 ||
                            response.url.indexOf("/security/authenticate") !== -1 ||
                            response.url.indexOf("/security/renew-token") !== -1
                        )) {
                            try {
                                var responseValues = typeof response.body === "string" ? JSON.parse(response.body) : response.body;
                                var token = null;
                                if (responseValues) {
                                    if (responseValues.result && responseValues.result.token) {
                                        token = responseValues.result.token;
                                    } else if (responseValues.token) {
                                        token = responseValues.token;
                                    } else if (responseValues.access_token) {
                                        token = responseValues.access_token;
                                    }
                                }
                                if (token && window.ui) {
                                    window.ui.preauthorizeApiKey("Bearer", token);
                                    window.ui.preauthorizeApiKey("bearer", token);
                                    window.ui.preauthorizeApiKey("jwt", token);
                                }
                            } catch (error) {
                                console.error("Token response not handled correctly!", error);
                            }
                        }
                        return response;
                    }
                });

                window.ui = ui;
            };
        </script>
    </body>
</html>
